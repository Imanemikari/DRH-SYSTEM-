<!DOCTYPE html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRH - Système de Gestion des Ressources Humaines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html[dir="ltr"] body { font-family: 'Inter', 'Segoe UI', sans-serif; }
      html[dir="rtl"] body { font-family: 'Noto Kufi Arabic', 'Inter', 'Segoe UI', sans-serif; }
      html.dark body { background: #0f172a; }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('drh-theme');
          var isDark = t ? (t === 'dark') : true;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
